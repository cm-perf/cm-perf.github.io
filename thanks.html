<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Enquiry received | CM Performance</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@300..600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0b;color:#f2f2f0;font-family:'Geist',system-ui,sans-serif;font-weight:300;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.box{max-width:520px}
.mark{width:52px;height:52px;border-radius:12px;margin:0 auto 22px}
.eyebrow{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#e85d04}
h1{font-size:clamp(28px,5vw,40px);font-weight:300;letter-spacing:-.01em;margin:14px 0 16px;line-height:1.1}
p{color:#8c8c90;font-size:16px;max-width:42ch;margin:0 auto 10px}
.actions{margin-top:28px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btn{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:11px 18px;border:1px solid rgba(255,255,255,.12);border-radius:4px;color:#f2f2f0;text-decoration:none}
.btn.fill{background:#e85d04;border-color:#e85d04;color:#0a0a0b;font-weight:500}
</style>
</head>
<body>
  <div class="box">
    <img class="mark" src="/favicon-192.png" alt="CM Performance" />
    <span class="eyebrow">Enquiry received</span>
    <h1>Thanks, we've got it.</h1>
    <p>We'll check what your BMW supports and reply from contact@cmperf.uk, usually within one business day.</p>
    <p class="mono" style="color:#808086;font-size:13px;margin-top:14px">Meanwhile, see builds and launches on Instagram.</p>
    <div class="actions">
      <a class="btn fill" href="https://www.instagram.com/cm.perf/" target="_blank" rel="noopener">@cm.perf &#8599;</a>
      <a class="btn" href="/">Back to site</a>
    </div>
  </div>
</body>
</html>
