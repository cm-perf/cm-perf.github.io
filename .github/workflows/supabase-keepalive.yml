name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days without API activity, which
# would take the order form down silently. This pings the project's REST API
# on a schedule so it always counts as active — independent of site traffic.
# The anon (publishable) key is already public in the site source by design.

on:
  schedule:
    - cron: "17 6 */2 * *" # every 2 days, 06:17 UTC (odd minute avoids load spikes)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_HYkDj6F6n6byI8l76vh-VQ_s2hGFfFS" \
            "https://jmdqqgftsfmavwnbqitx.supabase.co/auth/v1/health")
          echo "Supabase responded HTTP $code"
          test "$code" = "200"
